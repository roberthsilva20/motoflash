<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍽️ Motoflash — Painel do Restaurante</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f4f4; padding: 15px; }
    header { background: #111; color: white; padding: 18px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 20px; }
    .sair-btn { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { font-size: 18px; margin-bottom: 15px; color: #222; }
    input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
    button.criar { width: 100%; padding: 14px; background: #22c55e; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button.criar:disabled { background: #999; cursor: not-allowed; }
    .pedido { border: 1px solid #eee; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
    .pedido h4 { font-size: 15px; margin-bottom: 8px; color: #222; }
    .pedido p { font-size: 14px; margin-bottom: 4px; color: #555; }
    .status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; margin-top: 6px; }
    .status.pendente { background: #fef3c7; color: #92400e; }
    .status.confirmado { background: #dcfce7; color: #166534; }
    .status.aceito { background: #dbeafe; color: #1e40af; }
    .sem-dados { text-align: center; color: #888; padding: 20px; }
    .aviso { background: #f0fdf4; border-left: 4px solid #22c55e; padding: 12px; margin-bottom: 15px; border-radius: 4px; }
    .pix-box { background: #fef9c3; border: 1px dashed #ca8a04; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
    .pix-copia { background: white; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 12px; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
    .copiar-btn { background: #22c55e; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .suporte-box { background: #e0f2fe; border-left: 4px solid #0284c7; padding: 12px; border-radius: 4px; margin-bottom: 15px; }
    .suporte-box a { color: #0284c7; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>🍽️ Painel do Restaurante</h1>
    <button class="sair-btn" onclick="sair()">Sair</button>
  </header>

  <div class="card">
    <h2>📦 Novo Pedido de Entrega</h2>
    
    <div class="aviso">
      ⚠️ <strong>Valor mínimo da entrega: R$ 7,00</strong>
    </div>

    <div class="pix-box">
      <strong>💳 Chave PIX para pagamento:</strong>
      <div class="pix-copia">
        <span id="chave-pix">35377564000122</span>
        <button class="copiar-btn" onclick="copiarPix()">Copiar</button>
      </div>
    </div>

    <label style="font-weight:bold;font-size:14px;color:#333;">Valor total da entrega (R$)</label>
    <input type="number" id="valor" min="7" step="0.01" placeholder="Ex: 10,00">
    
    <label style="font-weight:bold;font-size:14px;color:#333;">Endereço de entrega</label>
    <textarea id="endereco" rows="2" placeholder="Rua, número, bairro, cidade"></textarea>
    
    <label style="font-weight:bold;font-size:14px;color:#333;">Observação (opcional)</label>
    <textarea id="obs" rows="2" placeholder="Instruções especiais"></textarea>

    <button class="criar" id="btn-criar" onclick="criarPedido()">📦 Criar Pedido</button>
    <div id="msg-criar" style="margin-top:10px;text-align:center;"></div>
  </div>

  <div class="card">
    <h2>📋 Meus Pedidos</h2>
    <div id="lista-pedidos">
      <p class="sem-dados">Carregando...</p>
    </div>
  </div>

  <div class="card">
    <div class="suporte-box">
      📱 <strong>Precisa de ajuda?</strong><br>
      Fale com a gente: <a href="https://wa.me/5532999231697" target="_blank">(32) 99923-1697</a>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBD9qiDcnYQJDGn850KUkMpiBatuP0DWT8",
      authDomain: "motoflash-b1396.firebaseapp.com",
      projectId: "motoflash-b1396",
      storageBucket: "motoflash-b1396.firebasestorage.app",
      messagingSenderId: "709365607477",
      appId: "1:709365607477:web:5a83bf82fafef1ca9e957c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let usuarioNome = "Restaurante";
    let restauranteId = "";
    const CHAVE_PIX_DONO = "35377564000122";
    const TAXA_DONO = 0.20;

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      restauranteId = user.uid;
      db.collection("usuarios").doc(user.uid).get().then(doc => {
        if (doc.exists) {
          usuarioNome = doc.data().nome || "Restaurante";
        }
        carregarPedidos();
      });
    });

    function sair() {
      auth.signOut().then(() => {
        window.location.href = "index.html";
      });
    }

    function copiarPix() {
      navigator.clipboard.writeText(CHAVE_PIX_DONO).then(() => {
        alert("✅ Chave PIX copiada!");
      });
    }

    async function criarPedido() {
      const valorInput = document.getElementById("valor").value;
      const endereco = document.getElementById("endereco").value.trim();
      const observacao = document.getElementById("obs").value.trim();
      const msgEl = document.getElementById("msg-criar");
      const btn = document.getElementById("btn-criar");

      if (!valorInput || parseFloat(valorInput) < 7) {
        msgEl.innerHTML = '<span style="color:#ef4444;">❌ Valor mínimo é R$ 7,00</span>';
        return;
      }
      if (!endereco) {
        msgEl.innerHTML = '<span style="color:#ef4444;">❌ Preencha o endereço</span>';
        return;
      }

      const valorTotal = parseFloat(valorInput);
      const valorDono = valorTotal * TAXA_DONO;
      const valorMotoboy = valorTotal - valorDono;

      btn.disabled = true;
      msgEl.innerHTML = '<span style="color:#22c55e;">⏳ Criando pedido...</span>';

      try {
        await db.collection("pedidos").add({
          restauranteId: restauranteId,
          restauranteNome: usuarioNome,
          valorTotal: valorTotal,
          valorDono: valorDono,
          valorMotoboy: valorMotoboy,
          endereco: endereco,
          observacao: observacao,
          status: "pendente",
          data: firebase.firestore.FieldValue.serverTimestamp()
        });

        msgEl.innerHTML = '<span style="color:#22c55e;">✅ Pedido criado com sucesso! Confirme o PIX abaixo.</span>';
        document.getElementById("valor").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("obs").value = "";
        carregarPedidos();
      } catch (erro) {
        msgEl.innerHTML = '<span style="color:#ef4444;">❌ Erro ao criar pedido</span>';
      }
      
      btn.disabled = false;
    }

    function confirmarPix(pedidoId) {
      if (!confirm("✅ Você já enviou o PIX?")) return;
      
      db.collection("pedidos").doc(pedidoId).update({
        status: "aguardando-aprovacao"
      }).then(() => {
        alert("✅ PIX confirmado! Aguardando aprovação do dono.");
      }).catch(() => {
        alert("❌ Erro ao confirmar");
      });
    }

    function carregarPedidos() {
      const lista = document.getElementById("lista-pedidos");
      
      db.collection("pedidos")
        .where("restauranteId", "==", restauranteId)
        .onSnapshot(snapshot => {
          lista.innerHTML = "";
          
          if (snapshot.empty) {
            lista.innerHTML = '<p class="sem-dados">Nenhum pedido criado ainda.</p>';
            return;
          }

          snapshot.forEach(doc => {
            const p = doc.data();
            const data = p.data ? new Date(p.data.toDate()).toLocaleString('pt-BR') : "";
            
            let statusClass = 'pendente';
            let statusTexto = '⏳ Aguardando Confirmação de PIX';
            if (p.status === 'aguardando-aprovacao') {
              statusClass = 'pendente';
              statusTexto = '⏳ PIX enviado — Aguardando dono confirmar';
            } else if (p.status === 'confirmado') {
              statusClass = 'confirmado';
              statusTexto = '✅ Disponível para Motoboys';
            } else if (p.status === 'aceito') {
              statusClass = 'aceito';
              statusTexto = '🏍️ Aceito por: ' + (p.motoboyNome || 'Motoboy');
            }

            let botoes = '';
            if (p.status === 'pendente') {
              botoes = `<button style="background:#3b82f6;color:white;border:none;padding:8px 14px;border-radius:6px;margin-top:10px;cursor:pointer;font-weight:bold;" onclick="confirmarPix('${doc.id}')">✅ Já enviei o PIX</button>`;
            }

            lista.innerHTML += `
              <div class="pedido">
                <h4>📦 Pedido — ${data}</h4>
                <p><strong>Valor:</strong> R$ ${p.valorTotal.toFixed(2).replace('.', ',')}</p>
                <p><strong>Endereço:</strong> ${p.endereco}</p>
                ${p.observacao ? `<p><strong>Obs:</strong> ${p.observacao}</p>` : ''}
                <span class="status ${statusClass}">${statusTexto}</span>
                ${botoes}
              </div>
            `;
          });
        });
    }
  </script>
</body>
</html>
