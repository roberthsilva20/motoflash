<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏍️ Motoflash — Painel Motoboy</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; font-family: Arial, sans-serif; }
    body { background:#f4f4f4; padding:15px; }
    header { background:#111; color:white; padding:16px; border-radius:10px; text-align:center; margin-bottom:20px; }
    .card { background:white; padding:18px; border-radius:10px; margin-bottom:15px; }
    h2 { font-size:18px; margin-bottom:12px; }
    .pedido { border:1px solid #ddd; border-radius:8px; padding:14px; margin-bottom:12px; }
    button { width:100%; padding:12px; border:none; border-radius:6px; background:#22c55e; color:white; font-weight:bold; font-size:15px; cursor:pointer; }
    .sempedido { text-align:center; color:#777; padding:30px; }
    .debug { background:#ffe4e6; padding:10px; border-radius:6px; margin-bottom:15px; }
  </style>
</head>
<body>
  <header>
    <h1>🏍️ Painel do Motoboy</h1>
  </header>
  <div class="debug">
    <p>🔍 <span id="textoDebug"></span></p>
  </div>
  <div class="card">
    <h2>📦 Pedidos Disponíveis</h2>
    <div id="listaPedidos">
      <p>Carregando...</p>
    </div>
  </div>

<script>
const firebaseConfig = {
      apiKey: "AIzaSyBD9qiDcnYQJDGn850KUkMpiBatuP0DWT8",
      authDomain: "motoflash-b1396.firebaseapp.com",
      projectId: "motoflash-b1396",
      storageBucket: "motoflash-b1396.firebasestorage.app",
      messagingSenderId: "709365607477",
      appId: "1:709365607477:web:5a83bf82fafef1ca9e957c"
    };

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const debugEl = document.getElementById("textoDebug");

let usuarioMotoboyNome = "";
let usuarioMotoboyId = "";

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="index.html";
    return;
  }
  usuarioMotoboyId = user.uid;
  db.collection("usuarios").doc(user.uid).get().then(doc=>{
    if(doc.exists){
      usuarioMotoboyNome = doc.data().nome;
    }
    carregarPedidosDisponiveis();
  })
})

function carregarPedidosDisponiveis(){
  const lista = document.getElementById("listaPedidos");
  debugEl.innerText = "Buscando pedidos com status = confirmado";
  db.collection("pedidos")
  .where("status","==","confirmado")
  .onSnapshot(snapshot=>{
    lista.innerHTML = "";
    debugEl.innerText = "Quantidade encontrada: " + snapshot.size;
    if(snapshot.empty){
      lista.innerHTML = "<p class='sempedido'>😔 Nenhum pedido disponível no momento!</p>";
      return;
    }
    snapshot.forEach(doc=>{
      const p = doc.data();
      lista.innerHTML += `
      <div class="pedido">
        <p><strong>Restaurante:</strong> ${p.restauranteNome}</p>
        <p><strong>Valor que você recebe:</strong> R$ ${p.valorMotoboy.toFixed(2).replace(".",",")}</p>
        <p><strong>Endereço:</strong> ${p.endereco}</p>
        <button onclick="aceitarPedido('${doc.id}')">✅ ACEITAR ESSA CORRIDA!</button>
      </div>
      `;
    })
  }, (erro)=>{
    debugEl.innerText = "ERRO: " + erro.message;
  })
}

function aceitarPedido(idPedido){
  if(!confirm("Você tem certeza que quer aceitar essa corrida?")) return;
  db.collection("pedidos").doc(idPedido).update({
    status: "aceito",
    motoboyId: usuarioMotoboyId,
    motoboyNome: usuarioMotoboyNome
  }).then(()=>{
    alert("✅ Corrida aceita! Boa entrega!!!");
  })
}
</script>
</body>
</html>
