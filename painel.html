<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏍️ Motoflash — Motoboy</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f4f4; padding: 15px; }
    header { background: #111; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
    .pedido { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; border-left: 4px solid #22c55e; }
    .btn { background: #22c55e; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; margin-top: 8px; }
    .sair { background: #666; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; }
    .mensagem { text-align: center; padding: 30px; color: #666; }
    .erro { background: #fee; color: red; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <button class="sair" onclick="sair()">← Sair</button>

  <header>
    <h1>🏍️ Pedidos Disponíveis</h1>
  </header>

  <div id="aviso"></div>
  <div id="lista"><div class="mensagem">Carregando...</div></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBD9qiDcnYQJDGn850KUkMpiBatuP0DWT8",
      authDomain: "motoflash-b1396.firebaseapp.com",
      projectId: "motoflash-b1396",
      storageBucket: "motoflash-b1396.firebasestorage.app",
      messagingSenderId: "709365607477",
      appId: "1:709365607477:web:5a83bf82fafef1ca9e957c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function sair() {
      auth.signOut().then(() => window.location.href = "index.html");
    }

    function mostrarPedidos(user) {
      const aviso = document.getElementById("aviso");
      const lista = document.getElementById("lista");
      
      db.collection("pedidos").get()
        .then(snapshot => {
          aviso.innerHTML = `<div style="background:#dcfce7;padding:10px;border-radius:6px;margin-bottom:15px;">✅ Conectado! ${snapshot.size} pedidos encontrados</div>`;
          lista.innerHTML = "";
          
          if (snapshot.empty) {
            lista.innerHTML = '<div class="mensagem">Nenhum pedido disponível no momento.</div>';
            return;
          }

          let temPedido = false;
          snapshot.forEach(doc => {
            const p = doc.data();
            if (p.status === "confirmado" && !p.motoboyId) {
              temPedido = true;
              lista.innerHTML += `
                <div class="pedido">
                  <h3>📍 ${p.restaurante || "Restaurante"}</h3>
                  <p><strong>Endereço:</strong> ${p.endereco || "-"}</p>
                  <p><strong>Valor total:</strong> R$ ${(p.valorTotal || 0).toFixed(2).replace('.', ',')}</p>
                  <p><strong>Sua parte:</strong> R$ ${(p.valorMoto || 0).toFixed(2).replace('.', ',')}</p>
                  <button class="btn" onclick="aceitar('${doc.id}')">✅ Aceitar Entrega</button>
                </div>
              `;
            }
          });

          if (!temPedido) {
            lista.innerHTML = '<div class="mensagem">Nenhum pedido disponível no momento.<br>Volte mais tarde!</div>';
          }
        })
        .catch(erro => {
          aviso.innerHTML = `<div class="erro">❌ Erro: ${erro.message}</div>`;
          lista.innerHTML = '<div class="mensagem">Não foi possível carregar os pedidos.</div>';
        });
    }

    auth.onAuthStateChanged(user => {
      if (!user) {
        document.getElementById("aviso").innerHTML = '<div class="erro">⚠️ Você precisa fazer login primeiro. Redirecionando...</div>';
        setTimeout(() => window.location.href = "index.html", 2000);
        return;
      }
      mostrarPedidos(user);
    });

    window.aceitar = function(id) {
      if (confirm("Aceitar essa entrega?")) {
        db.collection("pedidos").doc(id).update({
          status: "aceito",
          motoboyId: auth.currentUser.uid,
          motoboyNome: auth.currentUser.displayName || "Motoboy"
        }).then(() => {
          alert("✅ Pedido aceito!");
          mostrarPedidos(auth.currentUser);
        }).catch(err => alert("Erro: " + err.message));
      }
    }
  </script>
</body>
</html>
