<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏍️ Motoflash — Motoboy</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f4f4; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; }
    .passo { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #3b82f6; }
    .ok { border-left-color: #22c55e; background: #f0fdf4; }
    .erro { border-left-color: #ef4444; background: #fef2f2; }
    .pedido { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #22c55e; }
    .btn { background: #22c55e; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; font-size: 16px; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>🏍️ Pedidos Disponíveis</h1>

  <div id="passo1" class="passo">1️⃣ Iniciando Firebase...</div>
  <div id="passo2" class="passo">2️⃣ Conectando ao banco...</div>
  <div id="passo3" class="passo">3️⃣ Buscando pedidos...</div>
  <div id="pedidos"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBD9qiDcnYQJDGn850KUkMpiBatuP0DWT8",
      authDomain: "motoflash-b1396.firebaseapp.com",
      projectId: "motoflash-b1396",
      storageBucket: "motoflash-b1396.firebasestorage.app",
      messagingSenderId: "709365607477",
      appId: "1:709365607477:web:5a83bf82fafef1ca9e957c"
    };

    try {
      firebase.initializeApp(firebaseConfig);
      document.getElementById("passo1").className = "passo ok";
      document.getElementById("passo1").innerHTML = "1️⃣ Firebase ✅";
    } catch(e) {
      document.getElementById("passo1").className = "passo erro";
      document.getElementById("passo1").innerHTML = "1️⃣ Firebase ❌: " + e.message;
    }

    const db = firebase.firestore();
    document.getElementById("passo2").className = "passo ok";
    document.getElementById("passo2").innerHTML = "2️⃣ Banco conectado ✅";

    db.collection("pedidos").get()
      .then(snapshot => {
        document.getElementById("passo3").className = "passo ok";
        document.getElementById("passo3").innerHTML = `3️⃣ Encontrados ${snapshot.size} pedidos ✅`;
        
        const container = document.getElementById("pedidos");
        
        if (snapshot.empty) {
          container.innerHTML = "<p style='text-align:center;color:#666;padding:20px;'>Nenhum pedido cadastrado.</p>";
          return;
        }

        let temDisponivel = false;
        snapshot.forEach(doc => {
          const p = doc.data();
          
          if (p.status === "confirmado" && !p.motoboyId) {
            temDisponivel = true;
            container.innerHTML += `
              <div class="pedido">
                <h3>📍 ${p.restaurante || "Restaurante"}</h3>
                <p><strong>Endereço:</strong> ${p.endereco || "-"}</p>
                <p><strong>Valor:</strong> R$ ${(p.valorTotal || 0).toFixed(2).replace('.', ',')}</p>
                <p><strong>Status:</strong> ${p.status}</p>
                <button class="btn" onclick="alert('Aceito!')">✅ Aceitar</button>
              </div>
            `;
          }
        });

        if (!temDisponivel) {
          container.innerHTML = "<p style='text-align:center;color:#666;padding:20px;'>Nenhum pedido disponível no momento.</p>";
        }
      })
      .catch(err => {
        document.getElementById("passo3").className = "passo erro";
        document.getElementById("passo3").innerHTML = "3️⃣ Erro ❌: " + err.message;
      });
  </script>

</body>
</html>
