<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏍️ Motoflash — Motoboy</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f4f4; padding: 15px; }
    header { background: #111; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
    .aviso { background: #dbeafe; padding: 12px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #3b82f6; }
    .pedido { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; border-left: 4px solid #22c55e; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .pedido h3 { font-size: 16px; margin-bottom: 10px; color: #222; }
    .pedido p { margin-bottom: 6px; color: #444; font-size: 14px; }
    .btn { background: #22c55e; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; margin-top: 8px; }
    .sair { background: #666; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; }
    .sem-dados { color: #666; font-style: italic; text-align: center; padding: 40px 20px; }
  </style>
</head>
<body>
  <button class="sair" onclick="sair()">← Sair</button>

  <header>
    <h1>🏍️ Pedidos Disponíveis</h1>
  </header>

  <div class="aviso">
    💡 Apenas pedidos com PIX confirmado aparecem aqui. Clique para aceitar!
  </div>

  <div id="lista-pedidos"><p class="sem-dados">Carregando...</p></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBD9qiDcnYQJDGn850KUkMpiBatuP0DWT8",
      authDomain: "motoflash-b1396.firebaseapp.com",
      projectId: "motoflash-b1396",
      storageBucket: "motoflash-b1396.firebasestorage.app",
      messagingSenderId: "709365607477",
      appId: "1:709365607477:web:5a83bf82fafef1ca9e957c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function sair() {
      auth.signOut().then(() => window.location.href = "index.html");
    }

    auth.onAuthStateChanged(user => {
      if (!user) {
        document.getElementById("lista-pedidos").innerHTML = 
          '<p class="sem-dados">Faça login para ver os pedidos.</p>';
        return;
      }
      carregarPedidos();
    });

    function carregarPedidos() {
      const lista = document.getElementById("lista-pedidos");
      
      db.collection("pedidos")
        .where("status", "==", "confirmado")
        .onSnapshot(snapshot => {
          lista.innerHTML = "";
          
          if (snapshot.empty) {
            lista.innerHTML = '<p class="sem-dados">Nenhum pedido disponível no momento.<br>Volte mais tarde!</p>';
            return;
          }

          let temPedido = false;
          
          snapshot.forEach(doc => {
            const p = doc.data();
            
            // Só mostra se ainda não foi aceito por ninguém
            if (!p.motoboyId) {
              temPedido = true;
              const data = p.data ? new Date(p.data.toDate()).toLocaleString('pt-BR') : "Sem data";
              
              lista.innerHTML += `
                <div class="pedido">
                  <h3>📍 ${p.restaurante || "Restaurante"}</h3>
                  <p><strong>Endereço:</strong> ${p.endereco || "Não informado"}</p>
                  <p><strong>Valor total:</strong> R$ ${(p.valorTotal || 0).toFixed(2).replace('.', ',')}</p>
                  <p><strong>Sua parte:</strong> R$ ${(p.valorMoto || 0).toFixed(2).replace('.', ',')}</p>
                  <p><strong>Data:</strong> ${data}</p>
                  <button class="btn" onclick="aceitarPedido('${doc.id}')">✅ Aceitar Entrega</button>
                </div>
              `;
            }
          });

          if (!temPedido) {
            lista.innerHTML = '<p class="sem-dados">Nenhum pedido disponível no momento.<br>Volte mais tarde!</p>';
          }
        });
    }

    window.aceitarPedido = function(id) {
      if (!confirm("Tem certeza que deseja aceitar essa entrega?")) return;
      
      const user = auth.currentUser;
      if (!user) {
        alert("❌ Você precisa estar logado!");
        return;
      }
      
      db.collection("pedidos").doc(id).update({
        status: "aceito",
        motoboyId: user.uid,
        motoboyNome: user.displayName || "Motoboy",
        dataAceite: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(() => {
        alert("✅ Pedido aceito! Boa entrega! 🏍️");
        // A tela atualiza sozinha graças ao onSnapshot
      })
      .catch(err => {
        alert("❌ Erro: " + err.message);
      });
    }
  </script>
</body>
</html>
