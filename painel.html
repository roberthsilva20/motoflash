<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏍️ Motoflash - Painel Motoboy</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; font-family: Arial, sans-serif; }
    body { background:#f4f4f4; padding:15px; }
    header { background:#111; color:white; padding:16px; border-radius:10px; text-align:center; margin-bottom:15px; }
    .resumo { background:#22c55e; color:white; padding:15px; border-radius:10px; margin-bottom:15px; }
    .card { background:white; padding:15px; border-radius:10px; margin-bottom:15px; }
    h2 { margin-bottom:10px; font-size:18px; }
    .pedido { border:1px solid #ddd; border-radius:8px; padding:12px; margin-bottom:10px; }
    button { width:100%; padding:12px; border:none; border-radius:8px; background:#2563eb; color:white; font-weight:bold; font-size:16px; }
    .sempedido { text-align:center; color:#777; padding:20px; }
  </style>
</head>
<body>
  <header>
    <h1>🏍️ Painel do Motoboy</h1>
  </header>

  <div class="resumo">
    <h2>📊 Meus Ganhos</h2>
    <p>Total a receber: <strong id="totalGanho">R$ 0,00</strong></p>
    <p>Quantidade de entregas: <strong id="qtdEntregas">0</strong></p>
  </div>

  <div class="card">
    <h2>📋 Pedidos Disponíveis para Aceitar</h2>
    <div id="listaDisponiveis">
      <p>Carregando...</p>
    </div>
  </div>

  <div class="card">
    <h2>📜 Meu Histórico de Corridas</h2>
    <div id="listaMeusPedidos">
      <p>Carregando...</p>
    </div>
  </div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBD9qiDcnYQJDGn850KUkMpiBatuP0DWT8",
      authDomain: "motoflash-b1396.firebaseapp.com",
      projectId: "motoflash-b1396",
      storageBucket: "motoflash-b1396.firebasestorage.app",
      messagingSenderId: "709365607477",
      appId: "1:709365607477:web:5a83bf82fafef1ca9e957c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let usuarioMotoboyId = "";

    function valorSeguro(valor){
      const v = Number(valor || 0);
      return v.toFixed(2).replace(".",",");
    }

    auth.onAuthStateChanged(async (user)=>{
      if(!user){
        alert("Você precisa fazer login primeiro!");
        window.location.href = "index.html";
        return;
      }
      usuarioMotoboyId = user.uid;
      carregarPedidosDisponiveis();
      carregarMeusPedidos();
    })

    function carregarPedidosDisponiveis(){
      const lista = document.getElementById("listaDisponiveis");
      db.collection("pedidos")
      .where("status","==","confirmado")
      .onSnapshot(snapshot=>{
        lista.innerHTML = "";
        if(snapshot.empty){
          lista.innerHTML = "<p class='sempedido'>Nenhum pedido disponível no momento!</p>";
        }
        snapshot.forEach(doc=>{
          const p = doc.data();
          lista.innerHTML += `
          <div class="pedido">
            <p><strong>Restaurante:</strong> ${p.restauranteNome || "Sem nome"}</p>
            <p><strong>Endereço:</strong> ${p.endereco}</p>
            <p><strong>Valor da corrida:</strong> R$ ${valorSeguro(p.valorMotoboy)}</p>
            <button onclick="aceitarPedido('${doc.id}','${p.restauranteNome}','${p.endereco}',${p.valorMotoboy})">✅ ACEITAR CORRIDA</button>
          </div>
          `;
        })
      })
    }

    function aceitarPedido(idPedido, nomeRestaurante, endereco, valorCorrida){
      if(!confirm(`Deseja realmente aceitar essa corrida do ${nomeRestaurante} ?`)) return;
      db.collection("pedidos").doc(idPedido).update({
        status:"aceito",
        motoboyId: usuarioMotoboyId,
        motoboyNome: auth.currentUser.displayName || auth.currentUser.email
      }).then(()=>{
        alert("Corrida aceita com sucesso!");
      }).catch((erro)=>{
        alert("Erro ao aceitar corrida: " + erro.message);
      })
    }

    function carregarMeusPedidos(){
      const lista = document.getElementById("listaMeusPedidos");
      let valorTotal = 0;
      let qtdCorridas = 0;
      db.collection("pedidos")
      .where("motoboyId","==",usuarioMotoboyId)
      .onSnapshot(snapshot=>{
        lista.innerHTML = "";
        if(snapshot.empty){
          lista.innerHTML = "<p class='sempedido'>Ainda não aceitou nenhuma corrida!</p>";
        }
        snapshot.forEach(doc=>{
          qtdCorridas++;
          const p = doc.data();
          if(!p.pagoParaMotoboy){
            valorTotal += Number(p.valorMotoboy || 0);
          }
          const statusPagamento = p.pagoParaMotoboy ? "✅ JÁ RECEBIDO" : "⏳ Aguardando pagamento do dono";
          lista.innerHTML += `
          <div class="pedido">
            <p><strong>Restaurante:</strong> ${p.restauranteNome || "Sem nome"}</p>
            <p><strong>Endereço:</strong> ${p.endereco}</p>
            <p><strong>Valor da corrida:</strong> R$ ${valorSeguro(p.valorMotoboy)}</p>
            <p><strong>Status pagamento:</strong> ${statusPagamento}</p>
            <p><strong>Status corrida:</strong> ${p.status}</p>
          </div>
          `;
        })
        document.getElementById("totalGanho").innerText = "R$ " + valorSeguro(valorTotal);
        document.getElementById("qtdEntregas").innerText = qtdCorridas;
      })
    }
</script>
</body>
</html>
