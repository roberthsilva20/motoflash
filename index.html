<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motoflash</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f4f4; padding: 20px; min-height: 100vh; }
    .tela { display: none; max-width: 400px; margin: 0 auto; }
    .tela.ativa { display: block; }
    .caixa { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { text-align: center; margin-bottom: 20px; color: #222; }
    input, textarea { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 6px 0; }
    button:active { opacity: 0.8; }
    .laranja { background: #f59e0b; color: white; }
    .cinza { background: #eee; color: #333; }
    .verde { background: #16a34a; color: white; }
    .grupo-botoes { display: flex; gap: 10px; margin: 15px 0; }
    .grupo-botoes button { flex: 1; }
    .grupo-botoes button.ativo { border: 2px solid #f59e0b; background: #fff8eb; color: #b45309; }
    .pedido { background: white; padding: 15px; border-radius: 8px; margin: 10px 0; }
    .sair { background: none; color: #888; text-align: right; width: auto; margin: 0 0 15px auto; padding: 0; }
    .erro-box { background: #fee; color: #c00; padding: 10px; border-radius: 6px; margin: 10px 0; display: none; font-size: 14px; }
    .carregando { text-align: center; color: #666; padding: 10px; display: none; }
  </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="telaLogin" class="tela ativa">
  <div class="caixa">
    <h2>🏍️ Motoflash</h2>
    <div id="erroLogin" class="erro-box"></div>
    <div id="carregandoLogin" class="carregando">Carregando...</div>
    <input type="email" id="email" placeholder="Seu e-mail">
    <input type="password" id="senha" placeholder="Sua senha">
    <button class="laranja" onclick="entrar()">Entrar</button>
    <button class="cinza" onclick="irCadastro()">Criar conta</button>
  </div>
</div>

<!-- TELA DE CADASTRO -->
<div id="telaCadastro" class="tela">
  <div class="caixa">
    <h2>Criar Conta</h2>
    <div id="erroCadastro" class="erro-box"></div>
    <div id="carregandoCadastro" class="carregando">Carregando...</div>
    <input type="text" id="nomeCompleto" placeholder="Seu nome completo">
    <input type="email" id="cadEmail" placeholder="Seu e-mail">
    <input type="password" id="cadSenha" placeholder="Crie uma senha">
    <p style="text-align:center; margin:10px 0; font-weight:bold;">Eu sou:</p>
    <div class="grupo-botoes">
      <button id="btnRest" class="cinza" onclick="escolher('restaurante')">🍽️ Restaurante</button>
      <button id="btnMoto" class="cinza" onclick="escolher('motoboy')">🏍️ Motoboy</button>
    </div>
    <button class="laranja" onclick="criarConta()">Criar minha conta</button>
    <button class="cinza" onclick="voltar()">Voltar</button>
  </div>
</div>

<!-- PAINEL RESTAURANTE -->
<div id="telaRestaurante" class="tela">
  <button class="sair" onclick="sair()">← Sair</button>
  <div class="caixa">
    <h2>🍽️ Novo Pedido</h2>
    <textarea id="endereco" placeholder="Endereço de entrega..." rows="2"></textarea>
    <input type="number" id="valor" placeholder="Valor R$" min="7" step="0.01">
    <button class="laranja" onclick="enviarPedido()">📤 Enviar Pedido</button>
  </div>
  <div class="caixa" style="margin-top:20px;">
    <h3>📋 Meus Pedidos</h3>
    <div id="listaMeus"></div>
  </div>
</div>

<!-- PAINEL MOTOBOY -->
<div id="telaMotoboy" class="tela">
  <button class="sair" onclick="sair()">← Sair</button>
  <div class="caixa">
    <h2>🏍️ Pedidos Disponíveis</h2>
    <div id="listaPedidos"></div>
  </div>
</div>

<script>
// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyBD9qiDcnYQJDGn850KUkMpiBatuP0DWT8",
  authDomain: "motoflash-b1396.firebaseapp.com",
  projectId: "motoflash-b1396",
  storageBucket: "motoflash-b1396.firebasestorage.app"
};

try {
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();
  console.log('✅ Firebase conectado');
} catch (e) {
  console.log('❌ Erro Firebase:', e);
  alert('Erro ao conectar: ' + e.message);
}

let tipoUsuario = null;
let uid = null;
let listener1 = null;
let listener2 = null;

// TELAS
function mostrarTela(id) {
  document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
  document.getElementById(id).classList.add('ativa');
}
function irCadastro() { mostrarTela('telaCadastro'); limparErros(); }
function voltar() { mostrarTela('telaLogin'); tipoUsuario = null; document.getElementById('btnRest').classList.remove('ativo'); document.getElementById('btnMoto').classList.remove('ativo'); limparErros(); }
function limparErros() {
  document.getElementById('erroLogin').style.display = 'none';
  document.getElementById('erroCadastro').style.display = 'none';
}
function mostrarErro(qual, texto) {
  const el = document.getElementById(qual);
  el.textContent = '❌ ' + texto;
  el.style.display = 'block';
}
function escolher(tipo) {
  tipoUsuario = tipo;
  document.getElementById('btnRest').classList.toggle('ativo', tipo === 'restaurante');
  document.getElementById('btnMoto').classList.toggle('ativo', tipo === 'motoboy');
}

// CRIAR CONTA
async function criarConta() {
  limparErros();
  document.getElementById('carregandoCadastro').style.display = 'block';
  
  const nome = document.getElementById('nomeCompleto').value.trim();
  const email = document.getElementById('cadEmail').value.trim();
  const senha = document.getElementById('cadSenha').value;
  
  if (!nome || !email || !senha || !tipoUsuario) { 
    mostrarErro('erroCadastro', 'Preencha tudo e escolha seu perfil!'); 
    document.getElementById('carregandoCadastro').style.display = 'none';
    return; 
  }
  if (senha.length < 6) { 
    mostrarErro('erroCadastro', 'Senha precisa de pelo menos 6 dígitos!'); 
    document.getElementById('carregandoCadastro').style.display = 'none';
    return; 
  }
  
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, senha);
    await db.collection('usuarios').doc(cred.user.uid).set({ Nome: nome, Email: email, Tipo: tipoUsuario });
    alert('✅ Conta criada! Faça login.');
    voltar();
  } catch (e) {
    mostrarErro('erroCadastro', e.message);
  }
  document.getElementById('carregandoCadastro').style.display = 'none';
}

// LOGIN
async function entrar() {
  limparErros();
  document.getElementById('carregandoLogin').style.display = 'block';
  
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  
  if (!email || !senha) { 
    mostrarErro('erroLogin', 'Digite e-mail e senha!'); 
    document.getElementById('carregandoLogin').style.display = 'none';
    return; 
  }
  
  try {
    const cred = await auth.signInWithEmailAndPassword(email, senha);
    uid = cred.user.uid;
    const doc = await db.collection('usuarios').doc(uid).get();
    if (doc.exists) {
      tipoUsuario = doc.data().Tipo;
      if (tipoUsuario === 'restaurante') {
        mostrarTela('telaRestaurante');
        carregarMeusPedidos();
      } else {
        mostrarTela('telaMotoboy');
        carregarPedidosDisponiveis();
      }
    } else {
      mostrarErro('erroLogin', 'Perfil não encontrado!');
    }
  } catch (e) {
    mostrarErro('erroLogin', e.message);
  }
  document.getElementById('carregandoLogin').style.display = 'none';
}

// SAIR
function sair() {
  if (listener1) listener1();
  if (listener2) listener2();
  auth.signOut();
  uid = null;
  tipoUsuario = null;
  document.getElementById('email').value = '';
  document.getElementById('senha').value = '';
  mostrarTela('telaLogin');
}

// ENVIAR PEDIDO
async function enviarPedido() {
  const endereco = document.getElementById('endereco').value.trim();
  const valor = parseFloat(document.getElementById('valor').value);
  if (!endereco || !valor || valor < 7) { alert('Endereço e valor mínimo R$7,00!'); return; }
  
  await db.collection('pedidos').add({
    endereco: endereco,
    valorTotal: valor,
    taxa: valor * 0.20,
    valorMoto: valor * 0.80,
    usuarioId: uid,
    status: 'disponivel',
    data: new Date().toISOString()
  });
  
  alert('✅ Pedido enviado!');
  document.getElementById('endereco').value = '';
  document.getElementById('valor').value = '';
}

// ACEITAR PEDIDO
window.aceitar = async function(id) {
  await db.collection('pedidos').doc(id).update({ status: 'aceito', motoboyId: uid });
  alert('✅ Pedido aceito! Boa entrega!');
};

// CARREGAR PEDIDOS DO RESTAURANTE
function carregarMeusPedidos() {
  listener1 = db.collection('pedidos').where('usuarioId', '==', uid).orderBy('data', 'desc').limit(15)
    .onSnapshot(snap => {
      let html = '';
      if (snap.empty) { html = '<p style="text-align:center; color:#888;">Nenhum pedido ainda.</p>'; }
      snap.forEach(doc => {
        const p = doc.data();
        const status = p.status === 'disponivel' ? '🟡 Disponível' : '✅ Aceito';
        html += `<div class="pedido"><strong>${p.endereco}</strong><br>Valor: R$ ${p.valorTotal.toFixed(2)}<br>Status: ${status}</div>`;
      });
      document.getElementById('listaMeus').innerHTML = html;
    });
}

// CARREGAR PEDIDOS P/ MOTOBOY
function carregarPedidosDisponiveis() {
  listener2 = db.collection('pedidos').where('status', '==', 'disponivel').orderBy('data', 'desc').limit(20)
    .onSnapshot(snap => {
      let html = '';
      if (snap.empty) { html = '<p style="text-align:center; color:#888;">Nenhum pedido disponível.</p>'; }
      snap.forEach(doc => {
        const p = doc.data();
        html += `<div class="pedido"><strong>${p.endereco}</strong><br>Você recebe: R$ ${p.valorMoto.toFixed(2)}<br><button class="verde" onclick="aceitar('${doc.id}')">✅ Aceitar Pedido</button></div>`;
      });
      document.getElementById('listaPedidos').innerHTML = html;
    });
}
</script>

</body>
</html>
