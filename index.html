<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motoflash — Login</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: linear-gradient(135deg, #1a1a1a, #333); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: white; padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    h1 { text-align: center; color: #222; margin-bottom: 30px; font-size: 22px; }
    .aba { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
    .aba-btn { flex: 1; padding: 12px; border: none; background: none; font-size: 16px; cursor: pointer; color: #888; }
    .aba-btn.ativo { color: #22c55e; border-bottom: 2px solid #22c55e; margin-bottom: -2px; }
    input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
    input:focus { border-color: #22c55e; }
    select { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; background: white; }
    button.entrar { width: 100%; padding: 14px; background: #22c55e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button.entrar:hover { background: #16a34a; }
    button.entrar:disabled { background: #999; cursor: not-allowed; }
    .mensagem { margin-top: 15px; text-align: center; font-size: 14px; min-height: 20px; }
    .erro { color: #ef4444; }
    .sucesso { color: #22c55e; }
    .oculto { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏍️ Motoflash</h1>

    <div class="aba">
      <button class="aba-btn ativo" id="btn-login" onclick="mostrarAba('login')">Entrar</button>
      <button class="aba-btn" id="btn-cadastro" onclick="mostrarAba('cadastro')">Criar Conta</button>
    </div>

    <div id="area-login">
      <input type="email" id="email-login" placeholder="Seu e-mail">
      <input type="password" id="senha-login" placeholder="Sua senha">
      <button class="entrar" id="btn-entrar" onclick="fazerLogin()">Entrar</button>
      <div id="msg-login" class="mensagem"></div>
    </div>

    <div id="area-cadastro" class="oculto">
      <input type="text" id="nome-cadastro" placeholder="Seu nome completo">
      <input type="email" id="email-cadastro" placeholder="Seu e-mail">
      <input type="password" id="senha-cadastro" placeholder="Crie uma senha (mínimo 6 dígitos)">
      <select id="tipo-cadastro">
        <option value="">Você é...</option>
        <option value="restaurante">🍽️ Restaurante</option>
        <option value="motoboy">🏍️ Motoboy</option>
      </select>
      <button class="entrar" id="btn-cadastrar" onclick="fazerCadastro()">Criar Conta</button>
      <div id="msg-cadastro" class="mensagem"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBD9qiDcnYQJDGn850KUkMpiBatuP0DWT8",
      authDomain: "motoflash-b1396.firebaseapp.com",
      projectId: "motoflash-b1396",
      storageBucket: "motoflash-b1396.firebasestorage.app",
      messagingSenderId: "709365607477",
      appId: "1:709365607477:web:5a83bf82fafef1ca9e957c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function mostrarAba(nome) {
      document.getElementById('area-login').classList.toggle('oculto', nome !== 'login');
      document.getElementById('area-cadastro').classList.toggle('oculto', nome !== 'cadastro');
      document.getElementById('btn-login').classList.toggle('ativo', nome === 'login');
      document.getElementById('btn-cadastro').classList.toggle('ativo', nome === 'cadastro');
      limparMensagens();
    }

    function limparMensagens() {
      document.getElementById('msg-login').innerHTML = '';
      document.getElementById('msg-cadastro').innerHTML = '';
    }

    function mostrarMensagem(elId, texto, tipo) {
      const el = document.getElementById(elId);
      el.innerHTML = `<span class="${tipo}">${texto}</span>`;
    }

    async function fazerLogin() {
      const email = document.getElementById('email-login').value.trim();
      const senha = document.getElementById('senha-login').value;
      const msgId = 'msg-login';

      if (!email || !senha) {
        mostrarMensagem(msgId, '⚠️ Preencha e-mail e senha', 'erro');
        return;
      }

      try {
        mostrarMensagem(msgId, '⏳ Entrando...', 'sucesso');
        const userCred = await auth.signInWithEmailAndPassword(email, senha);
        const user = userCred.user;
        
        const doc = await db.collection('usuarios').doc(user.uid).get();
        
        if (!doc.exists) {
          mostrarMensagem(msgId, '❌ Usuário não cadastrado. Crie uma conta primeiro.', 'erro');
          return;
        }

        const dados = doc.data();
        
        if (dados.tipo === 'motoboy') {
          mostrarMensagem(msgId, '✅ Entrando...', 'sucesso');
          setTimeout(() => {
            window.location.href = 'painel.html';
          }, 800);
        } else if (dados.tipo === 'restaurante') {
          mostrarMensagem(msgId, '✅ Bem-vindo, Restaurante!', 'sucesso');
          // Aqui você coloca o painel do restaurante quando tiver
        } else {
          mostrarMensagem(msgId, '✅ Login realizado!', 'sucesso');
        }
      } catch (erro) {
        console.error('Erro de login:', erro);
        let texto = '❌ Erro ao entrar. Tente novamente.';
        if (erro.code === 'auth/user-not-found') texto = '❌ Usuário não encontrado';
        else if (erro.code === 'auth/wrong-password') texto = '❌ Senha incorreta';
        else if (erro.code === 'auth/invalid-email') texto = '❌ E-mail inválido';
        else if (erro.code === 'auth/network-request-failed') texto = '❌ Sem conexão com a internet';
        mostrarMensagem(msgId, texto, 'erro');
      }
    }

    async function fazerCadastro() {
      const nome = document.getElementById('nome-cadastro').value.trim();
      const email = document.getElementById('email-cadastro').value.trim();
      const senha = document.getElementById('senha-cadastro').value;
      const tipo = document.getElementById('tipo-cadastro').value;
      const msgId = 'msg-cadastro';

      if (!nome || !email || !senha || !tipo) {
        mostrarMensagem(msgId, '⚠️ Preencha todos os campos', 'erro');
        return;
      }
      if (senha.length < 6) {
        mostrarMensagem(msgId, '⚠️ Senha precisa de pelo menos 6 dígitos', 'erro');
        return;
      }

      try {
        mostrarMensagem(msgId, '⏳ Criando conta...', 'sucesso');
        const userCred = await auth.createUserWithEmailAndPassword(email, senha);
        const user = userCred.user;

        await user.updateProfile({ displayName: nome });

        await db.collection('usuarios').doc(user.uid).set({
          nome: nome,
          email: email,
          tipo: tipo,
          dataCadastro: firebase.firestore.FieldValue.serverTimestamp(),
          ativo: true
        });

        mostrarMensagem(msgId, '✅ Conta criada com sucesso! Faça login abaixo.', 'sucesso');
        setTimeout(() => mostrarAba('login'), 1500);
      } catch (erro) {
        console.error('Erro de cadastro:', erro);
        let texto = '❌ Erro ao criar conta';
        if (erro.code === 'auth/email-already-in-use') texto = '❌ Este e-mail já está em uso';
        else if (erro.code === 'auth/invalid-email') texto = '❌ E-mail inválido';
        mostrarMensagem(msgId, texto, 'erro');
      }
    }
  </script>
</body>
</html>
